name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Dung $X"
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Install Tuist
        run: |
          brew tap tuist/tuist
          brew trust tuist/tuist || true
          brew install --formula tuist/tuist/tuist || {
            echo "brew failed, trying mise"
            brew install mise
            mise use -g tuist@latest
            echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH
          }
          export PATH="$HOME/.local/share/mise/shims:$PATH"
          tuist version

      - name: Configure Median Swift package registry
        run: |
          swift package-registry set --global --scope median https://packages.median.co
          if [ -n "$MEDIAN_SPM_TOKEN" ]; then
            swift package-registry login https://packages.median.co --token "$MEDIAN_SPM_TOKEN" --no-confirm
          fi
        env:
          MEDIAN_SPM_TOKEN: ${{ secrets.MEDIAN_SPM_TOKEN }}

      - name: Generate Xcode project
        env:
          TUIST_PROJECT_NAME: ThankFlix
          TUIST_TARGET_NAME: ThankFlix
          TUIST_BUNDLE_ID: co.median.ios.lpappne
          TUIST_APP_NAME: ThankFlix
          TUIST_MARKETING_VERSION: 1.0.0
          TUIST_PROJECT_VERSION: "3"
        run: |
          rm -f ~/.swiftpm/security/fingerprints/median.go-native-core.json
          tuist install || true
          tuist generate --no-open

      - name: Build (no code signing)
        id: build
        continue-on-error: true
        run: |
          xcodebuild build \
            -workspace ThankFlix.xcworkspace \
            -scheme ThankFlix \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > xcodebuild.log 2>&1
          echo "exit=$?"

      - name: Push log to build-log branch
        if: always()
        run: |
          mkdir -p /tmp/logout
          { echo "== build outcome: ${{ steps.build.outcome }} =="; \
            echo "== ERRORS =="; grep -n -B2 -A6 "error:" xcodebuild.log | head -300; \
            echo "== TAIL =="; tail -80 xcodebuild.log; } > /tmp/logout/summary.txt
          cp xcodebuild.log /tmp/logout/full.log 2>/dev/null || true
          cd /tmp/logout
          git init -q
          git config user.name "ci"; git config user.email "ci@example.com"
          git checkout -q -b build-log
          git add -A; git commit -q -m "build log"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 65

      - name: Package IPA
        run: |
          APP=$(find "$PWD/dd" -type d -name "ThankFlix.app" -path "*Release-iphoneos*" | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then
            echo "Khong tim thay .app. Noi dung dd:"
            find "$PWD/dd" -maxdepth 4 | head -50
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ThankFlix.ipa Payload
          ls -la ThankFlix.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ThankFlix-ipa
          path: ThankFlix.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
